<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>公务员工资测算系统 V8.2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <script>
      /* 主题预载：默认日间模式 */
      (function () {
        var t = "light";
        try { t = localStorage.getItem("gw_salary_theme") === "dark" ? "dark" : "light"; } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      html { background-color: #e9edf3; color: #1d2430; }
      html[data-theme="dark"] { background-color: #101216; color: #e8eaf0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
